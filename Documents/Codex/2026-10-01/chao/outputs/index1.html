function nearestGrid(x,y){let gx=Math.round(x/GRID),gy=Math.round(y/GRID),best=null,bd=Infinity;for(let ring=0;ring<=5&&!best;ring++)for(let dy=-ring;dy<=ring;dy++)for(let dx=-ring;dx<=ring;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==ring)continue;let xx=Math.max(0,Math.min(GRID_W-1,gx+dx)),yy=Math.max(0,Math.min(GRID_H-1,gy+dy)),wx=xx*GRID,wy=yy*GRID,d=(wx-x)**2+(wy-y)**2;if(d<bd&&canStand(wx,wy)){best={x:xx,y:yy};bd=d}}return best}

const save=()=>localStorage.setItem('vuonnho2d',JSON.stringify(s));function say(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2100)}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function path(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill()}function tree(x,y,scale=1){scale*=1.22;ctx.save();let sh=ctx.createRadialGradient(x,y+9*scale,1,x,y+9*scale,29*scale);sh.addColorStop(0,'#385c3c66');sh.addColorStop(1,'#385c3c00');ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(x,y+9*scale,29*scale,11*scale,0,0,Math.PI*2);ctx.fill();let wood=ctx.createLinearGradient(x-5*scale,y,x+6*scale,y);wood.addColorStop(0,'#654632');wood.addColorStop(.35,'#bb8150');wood.addColorStop(.7,'#8e5b3b');wood.addColorStop(1,'#543b30');roundRect(x-5*scale,y-22*scale,10*scale,30*scale,4*scale,wood);ctx.strokeStyle='#805437';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(x,y-5*scale);ctx.lineTo(x-13*scale,y-26*scale);ctx.moveTo(x+1*scale,y-9*scale);ctx.lineTo(x+14*scale,y-28*scale);ctx.stroke();function crown(cx,cy,rx,ry,top,bottom){let g=ctx.createRadialGradient(cx-rx*.38,cy-ry*.48,1,cx,cy,Math.max(rx,ry)*1.25);g.addColorStop(0,top);g.addColorStop(.62,bottom);g.addColorStop(1,'#397449');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3e7646aa';ctx.lineWidth=1.2*scale;ctx.stroke()}crown(x,y-31*scale,21*scale,22*scale,'#a1d86d','#63ad54');crown(x-12*scale,y-36*scale,12*scale,14*scale,'#a9df78','#68b65b');crown(x+12*scale,y-39*scale,12*scale,14*scale,'#8fd36c','#50a251');crown(x+2*scale,y-49*scale,10*scale,12*scale,'#b4e57a','#70bd59');ellipse(x-8*scal
